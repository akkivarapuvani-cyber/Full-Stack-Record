<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Take Quiz - QuizMaster</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🧠 QuizMaster
        </div>

        <div class="nav-links">

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <main class="quiz-page">

        <div class="quiz-header">

            <h1>
                📝 Technical Knowledge Quiz
            </h1>

            <p>
                Select one answer for each question.
            </p>

        </div>


        <form id="quizForm">

            <div id="questions">

                <p class="loading">
                    Loading questions...
                </p>

            </div>


            <button
                type="submit"
                class="submit-quiz-btn">

                Submit Quiz

            </button>

        </form>

    </main>


    <script src="js/script.js"></script>


    <script>

        function logout() {

            sessionStorage.clear();

            window.location.href =
                "/login.html";

        }

    </script>

</body>

</html>
