<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANITS Campus Placement Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

   
    <header>

        <div class="logo">
            <img src="logo.png" alt="ANITS Logo">
        </div>

        <div class="title">
            <h1>Anil Neerukonda Institute of Technology & Sciences</h1>
            <h3>Campus Placement Portal</h3>
        </div>

    </header>

  
    <nav>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="companies.html">Companies</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>
    <h1 align="center">Student Login</h1>


    <div class="login-container">

        <h2>Student Login</h2>

        <form action="home.html" method="get">

            <label for="username">Username</label>

            <input
            type="text"
            id="username"
            name="username"
            required>

            <label for="password">Password</label>

            <input
            type="password"
            id="password"
            name="password"
            required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <!-- Footer -->

    <footer>

        © 2026 ANITS | Department of Training & Placement

    </footer>

</body>
</html>
